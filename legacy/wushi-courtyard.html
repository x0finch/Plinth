<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>乌石合院</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600&text=%E4%B9%8C%E7%9F%B3%E5%90%88%E9%99%A2&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0EC; --panel:#FFFFFF; --ink:#1E2629; --muted:#66706F; --line:#D8DCD6;
  --accent:#2F5D4A; --accent-soft:#E2ECE6; --accent-ink:#FFFFFF; --sun:#D18A1F; --danger:#B3473B;
  --paper:#F7F7F4; --wb:#2A3236; --wbh:#58656B; --wp:#CDD2CD; --wps:#545D61; --fence:#8C9599;
  --furn:#FFFFFF; --furns:#58616A; --dim:#4D5659; --sel:#2C7AA3; --chip:#F2F3F0;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121618; --panel:#1A1F22; --ink:#E3E7E5; --muted:#98A1A0; --line:#2C3337;
    --accent:#7FB79C; --accent-soft:#22342C; --accent-ink:#0F1A15; --sun:#E7A84A; --danger:#E07B6E;
    --paper:#1D2326; --wb:#D5DBDD; --wbh:#8E989B; --wp:#495256; --wps:#B4BCBE; --fence:#6E787C;
    --furn:#262D31; --furns:#AEB7B9; --dim:#A9B2B4; --sel:#6CB8DE; --chip:#22282B;
  }
}
:root[data-theme="dark"]{
  --bg:#121618; --panel:#1A1F22; --ink:#E3E7E5; --muted:#98A1A0; --line:#2C3337;
  --accent:#7FB79C; --accent-soft:#22342C; --accent-ink:#0F1A15; --sun:#E7A84A; --danger:#E07B6E;
  --paper:#1D2326; --wb:#D5DBDD; --wbh:#8E989B; --wp:#495256; --wps:#B4BCBE; --fence:#6E787C;
  --furn:#262D31; --furns:#AEB7B9; --dim:#A9B2B4; --sel:#6CB8DE; --chip:#22282B;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{height:100%;margin:0;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);
  font:14px/1.5 -apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  font-variant-numeric:tabular-nums;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}

header.top{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;flex:none}
header.top::-webkit-scrollbar{display:none}
.brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap;margin-right:6px}
.brand b{font-family:"Noto Serif SC","Songti SC","STSong",serif;font-weight:600;font-size:19px;letter-spacing:.06em}
.brand span{color:var(--muted);font-size:12px}
.seg{display:inline-flex;background:var(--chip);border-radius:9px;padding:3px;flex:none}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:7px;white-space:nowrap;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.spacer{flex:1}
.ib{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 9px;white-space:nowrap;flex:none}
.ib:disabled{opacity:.35;cursor:default}
.ib svg{width:17px;height:17px;flex:none}
.ib.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

main{flex:1;display:flex;min-height:0;position:relative}
nav.tools{width:66px;flex:none;display:flex;flex-direction:column;gap:2px;padding:8px 5px;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;border-radius:9px;padding:7px 2px;font-size:12px;color:var(--muted)}
.tool svg{width:22px;height:22px}
.tool.on{background:var(--accent-soft);color:var(--accent)}
.tool .sub{font-size:10px;opacity:.8}
.stage{flex:1;position:relative;overflow:hidden;background:var(--paper);touch-action:none;min-width:0;min-height:0}
#plan{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
#three{position:absolute;inset:0;opacity:0;pointer-events:none}
#three.live{pointer-events:auto}
#three canvas{display:block;width:100%!important;height:100%!important;touch-action:none}
.hint{position:absolute;left:12px;bottom:12px;max-width:calc(100% - 24px);background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--muted);pointer-events:none}
.compass{position:absolute;right:12px;top:12px;width:70px;height:70px;pointer-events:none}
.legend{position:absolute;right:12px;bottom:12px;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;display:none}
.legend .bar{height:8px;width:160px;border-radius:4px;margin:4px 0}
.legend .ticks{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}
.readout3d{position:absolute;left:12px;top:12px;font-size:12px;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:8px;padding:6px 10px;display:none}

#hud{position:absolute;inset:0;display:none;pointer-events:none}
#three,#three canvas,#hud{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body.walking,body.walking *{-webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important}
#hud .bar{position:absolute;top:12px;right:12px;display:flex;gap:6px;pointer-events:auto}
#hud .joy{position:absolute;width:110px;height:110px;border-radius:50%;border:2px solid rgba(255,255,255,.7);background:rgba(0,0,0,.18);display:none;transform:translate(-50%,-50%)}
#hud .joy i{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(255,255,255,.85)}
#hud .cross{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border:2px solid rgba(255,255,255,.85);border-radius:50%;mix-blend-mode:difference}

aside.panel{width:310px;flex:none;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;border:0;background:transparent;padding:10px 0;color:var(--muted);border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.pbody{flex:1;overflow-y:auto;padding:14px}
.pbody h3{font-size:15px;font-weight:600;margin:0 0 10px}
.pbody h4{font-size:12px;font-weight:600;color:var(--muted);margin:16px 0 6px}
.row{display:flex;align-items:center;gap:8px;margin:6px 0}
.row label{width:56px;color:var(--muted);font-size:13px;flex:none}
.row input[type=number],.row input[type=text]{flex:1;min-width:0;border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:6px 8px}
.row input[type=range]{flex:1;accent-color:var(--accent)}
.muted{color:var(--muted);font-size:13px}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 11px}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sw{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sw button{border:2px solid transparent;background:var(--chip);border-radius:9px;padding:4px;display:flex;flex-direction:column;gap:3px;align-items:stretch;font-size:12px}
.sw button.on{border-color:var(--accent)}
.sw i{display:block;height:38px;border-radius:6px;background-size:cover}
.rooms{width:100%;border-collapse:collapse;font-size:13px}
.rooms td{padding:7px 4px;border-bottom:1px solid var(--line)}
.rooms tr{cursor:pointer}
.rooms tr.on td{background:var(--accent-soft)}
.rooms td.num{text-align:right;white-space:nowrap}
.sum{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13px;margin-top:12px;padding:10px;border-radius:9px;background:var(--chip)}
.sum b{font-weight:600;text-align:right}
.lib{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.lib button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 8px;text-align:left;font-size:13px;display:flex;justify-content:space-between;gap:6px}
.lib button small{color:var(--muted);font-size:11px;white-space:nowrap}
.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.stat div{background:var(--chip);border-radius:9px;padding:8px 10px}
.stat small{display:block;color:var(--muted);font-size:11px}
.stat b{font-size:16px;font-weight:600}
.grip{display:none}

#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:9px 14px;border-radius:9px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:50;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
#modal .box{background:var(--panel);border-radius:12px;padding:18px;max-width:560px;width:100%;max-height:90%;overflow:auto}
#modal img{max-width:100%;border-radius:6px;border:1px solid var(--line)}
.menu{position:absolute;right:12px;top:52px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.15);padding:6px;display:none;z-index:40;min-width:170px}
.menu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:7px}
.menu button:hover{background:var(--chip)}

/* plan drawing */
#plan .site{fill:none;stroke:var(--danger);stroke-width:1;stroke-dasharray:8 5;vector-effect:non-scaling-stroke;opacity:.55}
#plan .room{opacity:.92}
#plan .void{fill:url(#hv)}
#plan .wb{fill:url(#hb)}
#plan .wp{fill:var(--wp);stroke:var(--wps);stroke-width:1;vector-effect:non-scaling-stroke}
#plan .wf{fill:url(#hf)}
#plan .wr{fill:var(--wps)}
#plan .chim{fill:#9A5A44;stroke:var(--wps);stroke-width:1;vector-effect:non-scaling-stroke}
#plan .chimin{fill:#3A3330}
#plan .awn{fill:#E3D3B2;fill-opacity:.45;stroke:#B89574;stroke-width:1.5;stroke-dasharray:8 5;vector-effect:non-scaling-stroke}
#plan .shed{fill:#B89574;fill-opacity:.55;stroke:var(--wps);stroke-width:1;stroke-dasharray:5 3;vector-effect:non-scaling-stroke}
#plan .pond{fill:#4F86A3;fill-opacity:.75;stroke:#8E8A82;stroke-width:4;vector-effect:non-scaling-stroke}
#plan .drain{fill:#3D4448;fill-opacity:.55;stroke:var(--wps);stroke-width:1;stroke-dasharray:2 2;vector-effect:non-scaling-stroke}
#plan .pit{fill:#9C988E;fill-opacity:.45;stroke:var(--wps);stroke-width:1;stroke-dasharray:3 3;vector-effect:non-scaling-stroke}
#plan .hole{fill:var(--paper);stroke:var(--sun);stroke-width:1.5;vector-effect:non-scaling-stroke}
#plan .wwd{stroke:#D9534F;stroke-linecap:round;vector-effect:non-scaling-stroke;opacity:.85}
#plan .wwo{fill:#D9534F;stroke:#fff;stroke-width:1.5;vector-effect:non-scaling-stroke}
#plan .shd{fill:var(--sun);fill-opacity:.12;stroke:var(--sun);stroke-width:1.5;stroke-dasharray:8 5;vector-effect:non-scaling-stroke}
#plan .gwc{stroke:var(--sel);stroke-width:1.4;vector-effect:non-scaling-stroke}
#plan .gwo{stroke:var(--sel);stroke-width:1.2;stroke-dasharray:3 4;vector-effect:non-scaling-stroke;opacity:.8}
#plan .wpa{fill:var(--fence);stroke:var(--wps);stroke-width:1;vector-effect:non-scaling-stroke}
#plan .col{fill:var(--wb)}
#plan .gap{fill:var(--paper)}
#plan .ln{fill:none;stroke:var(--wps);stroke-width:1;vector-effect:non-scaling-stroke}
#plan .lnd{fill:none;stroke:var(--wps);stroke-width:1;stroke-dasharray:4 3;vector-effect:non-scaling-stroke}
#plan .door{fill:none;stroke:var(--wps);stroke-width:1;vector-effect:non-scaling-stroke}
#plan .fs{fill:var(--furn);stroke:var(--furns);stroke-width:1;vector-effect:non-scaling-stroke}
#plan .fd{fill:var(--wp);stroke:var(--furns);stroke-width:1;vector-effect:non-scaling-stroke}
#plan .fl{fill:none;stroke:var(--furns);stroke-width:1;vector-effect:non-scaling-stroke}
#plan .ft{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:1;stroke-dasharray:5 4;vector-effect:non-scaling-stroke}
#plan .stair{fill:none;stroke:var(--wps);stroke-width:1;vector-effect:non-scaling-stroke}
#plan .lbl{fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:var(--paper);stroke-linejoin:round}
#plan .lbl2{fill:var(--muted);text-anchor:middle;paint-order:stroke;stroke:var(--paper);stroke-linejoin:round}
#plan .dim{fill:none;stroke:var(--dim);stroke-width:1;vector-effect:non-scaling-stroke}
#plan .dimt{fill:var(--dim);text-anchor:middle}
#plan .meas{fill:none;stroke:var(--sun);stroke-width:2;vector-effect:non-scaling-stroke}
#plan .measd{fill:var(--sun)}
#plan .meast{fill:var(--sun);text-anchor:middle;paint-order:stroke;stroke:var(--paper);font-weight:600}
#plan .guide{fill:none;stroke:var(--sel);stroke-width:1.5;stroke-dasharray:6 4;vector-effect:non-scaling-stroke}
#plan .selbox{fill:none;stroke:var(--sel);stroke-width:1.5;stroke-dasharray:5 3;vector-effect:non-scaling-stroke}
#plan .hdl{fill:var(--panel);stroke:var(--sel);stroke-width:2;vector-effect:non-scaling-stroke;cursor:grab}
#plan .hit{fill:transparent}
#plan .hit.on{fill:var(--sel);fill-opacity:.3}
#plan.t-demolish .hit.np{cursor:pointer}
#plan.t-demolish .hit.np:hover{fill:var(--danger);fill-opacity:.45}
#plan.t-demolish .hit.bear:hover{fill:var(--muted);fill-opacity:.25;cursor:not-allowed}
#plan.t-paint .room:hover{opacity:.7;cursor:pointer}
#plan.t-select .furn{cursor:move}
#plan .roomsel{fill:none;stroke:var(--sel);stroke-width:2;stroke-dasharray:7 4;vector-effect:non-scaling-stroke}
#plan .hbbg{fill:var(--wb)} #plan .hbln{stroke:var(--wbh)}
#plan .hfbg{fill:var(--fence)} #plan .hfln{stroke:var(--wps);stroke-opacity:.5}
#plan .hvln{stroke:var(--muted);stroke-opacity:.35}

/* floating chrome */
main{position:relative}
.stage{flex:1}
.tb{position:absolute;top:10px;display:flex;gap:6px;align-items:center;z-index:12;max-width:calc(100% - 20px)}
.tb-l{left:10px}
.tb-r{right:10px}
.tb .seg{background:var(--panel);box-shadow:0 2px 10px rgba(0,0,0,.12);border:1px solid var(--line)}
.schsel{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--panel) url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2710%27 height=%276%27%3E%3Cpath d=%27M0 0l5 6 5-6z%27 fill=%27%2366706F%27/%3E%3C/svg%3E") no-repeat right 10px center;color:var(--ink);border-radius:9px;padding:6px 30px 6px 12px;font-weight:600;box-shadow:0 2px 10px rgba(0,0,0,.12);flex:none;cursor:pointer}
.tb .seg button.on{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.tb .ib{box-shadow:0 2px 10px rgba(0,0,0,.10)}
.tb .brand{font-family:"Noto Serif SC","Songti SC","STSong",serif;font-weight:600;font-size:17px;letter-spacing:.06em;margin:0 4px 0 2px;white-space:nowrap}
.menu{top:54px;right:10px}
.rail{position:absolute;left:10px;top:58px;display:flex;flex-direction:column;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px;box-shadow:0 2px 12px rgba(0,0,0,.12);z-index:11;max-height:calc(100% - 70px);overflow-y:auto}
.rail .tool{padding:6px 4px;min-width:52px}
.rail .tool span{font-size:11px}
.compass{top:58px;right:12px;width:56px;height:56px}
.readout3d{top:58px;left:auto;right:12px;max-width:calc(100% - 240px)}
.hint{opacity:0;transition:opacity .3s;left:80px;bottom:14px}
.hint.on{opacity:1}
.legend{right:12px;bottom:12px}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.28);display:none;z-index:18}
.scrim.on{display:block}
.fabwrap{position:absolute;right:16px;bottom:16px;display:none;flex-direction:column;align-items:flex-end;gap:12px;z-index:20}
.fabrow{display:flex;align-items:center;gap:10px}
.fab{width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:0;box-shadow:0 4px 16px rgba(0,0,0,.28);display:grid;place-items:center}
.fab svg{width:25px;height:25px}
.mini{width:42px;height:42px;border-radius:50%;background:var(--panel);color:var(--ink);border:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.18);display:grid;place-items:center}
.mini svg{width:19px;height:19px}
.mini[hidden]{display:none}
.chip{background:var(--ink);color:var(--paper);font-size:12px;padding:5px 11px;border-radius:14px;white-space:nowrap;display:none}
.chip.on{display:inline-block}
.dial{display:none;flex-direction:column;align-items:flex-end;gap:9px;max-height:calc(100vh - 160px);overflow-y:auto;padding:2px}
.dial.open{display:flex}
.dial button{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:0;color:var(--ink)}
.dial button span{background:var(--panel);padding:5px 11px;border-radius:8px;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.15);white-space:nowrap}
.dial button i{width:46px;height:46px;border-radius:50%;background:var(--panel);display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.2);border:1px solid var(--line)}
.dial button i svg{width:21px;height:21px}
.dial button.on i{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dial button.on span{color:var(--accent);font-weight:600}
.dial .sep{height:1px;width:46px;background:transparent}
.tabs .x{flex:0 0 42px;font-size:15px}
aside.panel.off{display:none}
.grip{display:none}
body.walking .fabwrap,body.walking .rail,body.walking .tb-r{display:none}
body.touring .fabwrap,body.touring .rail,body.touring .tb,body.touring .compass,body.touring .readout3d,body.touring .hint,body.touring .legend{display:none!important}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .45s;z-index:25}
#tourCap{position:absolute;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:min(680px,90%);background:rgba(15,20,22,.62);color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;line-height:1.6;text-align:center;opacity:0;transition:opacity .5s;pointer-events:none;z-index:24;backdrop-filter:blur(4px)}
#tourCap.on{opacity:1}
#tourBar{position:absolute;top:12px;right:12px;display:none;gap:6px;z-index:26}
body.touring #tourBar{display:flex}
#tourProg{position:absolute;left:0;right:0;top:0;height:3px;display:none;z-index:26;background:rgba(255,255,255,.15)}
#tourProg i{display:block;height:100%;width:0;background:var(--sun)}
body.touring #tourProg{display:block}
#tourBtn{position:absolute;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:none;border:0;background:var(--accent);color:var(--accent-ink);padding:12px 22px;border-radius:26px;font-size:15px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.28);z-index:21}
#tourBtn.on{display:block}
body.touring #tourBtn,body.walking #tourBtn{display:none}
@media (max-width:820px){#tourBtn{bottom:calc(88px + env(safe-area-inset-bottom,0px))}#tourCap{font-size:14px;padding:10px 14px}}
@media (max-width:820px){
  .rail,.tb-r,.tb .brand{display:none}
  .tb .seg button{padding:6px 11px}
  .tb-l{gap:5px}

    case 'gravel':{g.fillStyle='#a19e96';g.fillRect(0,0,N,N);for(let k=0;k<1400;k++){g.fillStyle=rgbs(jit([176,172,164],60,r));g.beginPath();g.ellipse(r()*N,r()*N,1.5+r()*3,1+r()*2.2,r()*3,0,7);g.fill();}break;}
  }

}

/* ============ geometry helpers ============ */
const isH=w=>w.y1===w.y2;
const wlen=w=>isH(w)?w.x2-w.x1:w.y2-w.y1;
function normWall(w){if(w.x1>w.x2||w.y1>w.y2){[w.x1,w.x2]=[w.x2,w.x1];[w.y1,w.y2]=[w.y2,w.y1];}}
function wallSegs(w,cutAll=true,extO){ // along-axis segments of solid wall (mm from start)
  const L=wlen(w),ext=w.kind==='rail'?0:(extO!=null?extO:w.t/2);let segs=[[-ext,L+ext]];
  for(const o of [...w.ops].sort((a,b)=>a.c-b.c)){if(!cutAll&&o.type==='win')continue;const a=o.c-o.w/2,b=o.c+o.w/2;const nx=[];
    for(const [s,e] of segs){if(b<=s||a>=e){nx.push([s,e]);continue;}if(a>s)nx.push([s,a]);if(b<e)nx.push([b,e]);}segs=nx;}
  return segs;
}
function segRect(w,a,b,t){t=t??w.t;return isH(w)?{x:w.x1+a,y:w.y1-t/2,w:b-a,h:t}:{x:w.x1-t/2,y:w.y1+a,w:t,h:b-a};}
function gridUnion(rects){
  const xs=[...new Set(rects.flatMap(r=>[r.x,r.x+r.w]))].sort((a,b)=>a-b),ys=[...new Set(rects.flatMap(r=>[r.y,r.y+r.h]))].sort((a,b)=>a-b);
  const nx=xs.length-1,ny=ys.length-1,cov=[];
  for(let i=0;i<nx;i++){cov[i]=[];for(let j=0;j<ny;j++){const cx=(xs[i]+xs[i+1])/2,cy=(ys[j]+ys[j+1])/2;cov[i][j]=rects.some(r=>cx>r.x&&cx<r.x+r.w&&cy>r.y&&cy<r.y+r.h);}}
  const C=(i,j)=>i>=0&&j>=0&&i<nx&&j<ny&&cov[i][j];let area=0;const edges=[];
  for(let i=0;i<nx;i++)for(let j=0;j<ny;j++){if(!cov[i][j])continue;area+=(xs[i+1]-xs[i])*(ys[j+1]-ys[j]);
    if(!C(i,j-1))edges.push({o:'h',v:ys[j],a:xs[i],b:xs[i+1]});if(!C(i,j+1))edges.push({o:'h',v:ys[j+1],a:xs[i],b:xs[i+1]});
    if(!C(i-1,j))edges.push({o:'v',v:xs[i],a:ys[j],b:ys[j+1]});if(!C(i+1,j))edges.push({o:'v',v:xs[i+1],a:ys[j],b:ys[j+1]});}
  return{area,edges};
}
function wallRect(w){const h=w.t/2;return isH(w)?[Math.min(w.x1,w.x2)-(w.kind==='wall'?h:0),w.y1-h,Math.max(w.x1,w.x2)+(w.kind==='wall'?h:0),w.y1+h]:[w.x1-h,Math.min(w.y1,w.y2)-(w.kind==='wall'?h:0),w.x1+h,Math.max(w.y1,w.y2)+(w.kind==='wall'?h:0)];}
// exact area on a compressed grid: cells inside `inc` rectangles and outside every `exc` rectangle
function gridArea(inc,exc){const xs=new Set(),ys=new Set();for(const r of inc.concat(exc)){xs.add(r[0]);xs.add(r[2]);ys.add(r[1]);ys.add(r[3]);}
  const X=[...xs].sort((a,b)=>a-b),Y=[...ys].sort((a,b)=>a-b);let A=0;
  for(let i=0;i<X.length-1;i++)for(let j=0;j<Y.length-1;j++){const cx=(X[i]+X[i+1])/2,cy=(Y[j]+Y[j+1])/2,in_=r=>cx>r[0]&&cx<r[2]&&cy>r[1]&&cy<r[3];
    if(inc.some(in_)&&!exc.some(in_))A+=(X[i+1]-X[i])*(Y[j+1]-Y[j]);}
  return A;}
// net (clear) area: the room's rectangles minus the actual wall bodies, so corners are not deducted twice
function netArea(room,walls){const inc=room.rects.map(r=>[r.x,r.y,r.x+r.w,r.y+r.h]);
  const exc=walls.filter(w=>w.kind!=='rail').map(wallRect);return gridArea(inc,exc)/1e6;}
// gross floor area: indoor rooms plus the walls around them, measured to the outer face of the walls
function grossArea(fl){const ins=fl.rooms.filter(r=>r.kind==='in').map(r=>r.rects.map(q=>[q.x,q.y,q.x+q.w,q.y+q.h])).flat();if(!ins.length)return 0;
  const near=(w)=>{const r=wallRect(w);return ins.some(q=>r[0]<=q[2]+1&&r[2]>=q[0]-1&&r[1]<=q[3]+1&&r[3]>=q[1]-1);};
  const ws=fl.walls.filter(w=>w.kind==='wall'&&near(w)).map(wallRect);return gridArea(ins.concat(ws),[])/1e6;}
function bigRect(r){return r.rects.reduce((a,b)=>a.w*a.h>=b.w*b.h?a:b);}

/* ============ furniture snapping ============ */
function snapFurn(f,fl){
  S.guides=[];let r=((f.rot%360)+360)%360;const k=Math.round(r/90);
  if(Math.abs(r-k*90)>8)return;f.rot=(k*90)%360;if(f.rot>180)f.rot-=360;
  const ex=(k%2)?f.d/2:f.w/2,ey=(k%2)?f.w/2:f.d/2,TH=Math.max(150,10/view.s);
  let bx=null,by=null;
  for(const w of fl.walls){if(w.kind==='rail'&&f.k!=='plant')continue;
    if(!isH(w)){if(ov(f.y-ey,f.y+ey,w.y1,w.y2)<=0)continue;
      for(const face of [w.x1-w.t/2,w.x1+w.t/2]){
        const dl=face-(f.x-ex),dr=face-(f.x+ex);
        if(f.x>face&&Math.abs(dl)<TH&&(!bx||Math.abs(dl)<Math.abs(bx.d)))bx={d:dl,face,w};
        if(f.x<face&&Math.abs(dr)<TH&&(!bx||Math.abs(dr)<Math.abs(bx.d)))bx={d:dr,face,w};}}
    else{if(ov(f.x-ex,f.x+ex,w.x1,w.x2)<=0)continue;
      for(const face of [w.y1-w.t/2,w.y1+w.t/2]){
        const dt=face-(f.y-ey),db=face-(f.y+ey);
        if(f.y>face&&Math.abs(dt)<TH&&(!by||Math.abs(dt)<Math.abs(by.d)))by={d:dt,face,w};
        if(f.y<face&&Math.abs(db)<TH&&(!by||Math.abs(db)<Math.abs(by.d)))by={d:db,face,w};}}}
  if(bx){f.x+=bx.d;S.guides.push({x1:bx.face,y1:bx.w.y1,x2:bx.face,y2:bx.w.y2});}
  if(by){f.y+=by.d;S.guides.push({x1:by.w.x1,y1:by.face,x2:by.w.x2,y2:by.face});}
  f.x=Math.round(f.x);f.y=Math.round(f.y);
}

/* ============ 2D furniture symbols ============ */
function furn2D(k,w,d){
  const hw=w/2,hd=d/2,R=(x,y,ww,hh,c='fs',rx=0)=>`<rect class="${c}" x="${x}" y="${y}" width="${ww}" height="${hh}" rx="${rx}"/>`;
  const L=(x1,y1,x2,y2,c='fl')=>`<line class="${c}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
  const C=(x,y,r,c='fs')=>`<circle class="${c}" cx="${x}" cy="${y}" r="${r}"/>`;
  const E=(x,y,rx,ry,c='fs')=>`<ellipse class="${c}" cx="${x}" cy="${y}" rx="${rx}" ry="${ry}"/>`;
  switch(k){
    case 'sofa3':case 'sofa2':case 'armchair':{const a=Math.min(180,w*.12),b=d*.24;let s=R(-hw,-hd,w,d,'fs',60)+R(-hw,-hd,w,b,'fd',50)+R(-hw,-hd,a,d,'fd',50)+R(hw-a,-hd,a,d,'fd',50);
      const n=k==='sofa3'?3:k==='sofa2'?2:1,cw=(w-2*a)/n;for(let i=1;i<n;i++)s+=L(-hw+a+cw*i,-hd+b,-hw+a+cw*i,hd);return s;}
    case 'coffee':case 'sidetable':case 'teatable':return R(-hw,-hd,w,d,'fs',20)+R(-hw+60,-hd+60,w-120,d-120,'fl',10);
    case 'dining':case 'desk':return R(-hw,-hd,w,d,'fs',k==='dining'?30:0);
    case 'chair':return R(-hw,-hd+60,w,d-60,'fs',40)+R(-hw,-hd,w,90,'fd',30);
    case 'tvstand':return R(-hw,-hd,w,d)+R(-w*.35,-hd+40,w*.7,60,'fd');
    case 'bed18':case 'bed15':case 'bed12':{const hb=Math.max(60,d*.04);let s=R(-hw,-hd,w,d,'fs',30)+R(-hw,-hd,w,hb,'fd');
      const np=k==='bed12'?1:2,pw=(w-150*(np+1))/np;for(let i=0;i<np;i++)s+=R(-hw+150+i*(pw+150),-hd+hb+80,pw,380,'fs',80);
      s+=R(-hw,-hd+d*.36,w,d*.64,'fd',20)+L(-hw,-hd+d*.36+180,hw,-hd+d*.36+180);return s;}
    case 'nightstand':return R(-hw,-hd,w,d)+C(0,0,Math.min(w,d)*.25,'fl');
    case 'wardrobe':{let s=R(-hw,-hd,w,d)+L(-hw+50,0,hw-50,0);for(let x=-hw+150;x<hw-100;x+=180)s+=L(x-50,-d*.18,x+50,d*.18);return s;}
    case 'bookcase':{let s=R(-hw,-hd,w,d);const n=Math.max(2,Math.round(w/400));for(let i=1;i<n;i++)s+=L(-hw+w*i/n,-hd,-hw+w*i/n,hd);return s;}
    case 'counter':{let s=R(-hw,-hd,w,d)+R(-hw+w*.18,-hd+90,Math.min(750,w*.3),d-180,'fl',60);const sx=hw-Math.min(750,w*.3)-60;s+=C(sx+180,-80,95,'fl')+C(sx+460,-80,95,'fl')+C(sx+180,140,80,'fl')+C(sx+460,140,80,'fl');return s;}
    case 'woodstove':return R(-hw,-hd,w,d,'fd',40)+C(-w*.24,-d*.05,d*.28,'fs')+C(w*.24,-d*.05,d*.28,'fs')+C(-w*.24,-d*.05,d*.2,'fl')+C(w*.24,-d*.05,d*.2,'fl')+R(-w*.32,hd-90,w*.16,90,'fs')+R(w*.16,hd-90,w*.16,90,'fs');
    case 'island':return R(-hw,-hd,w,d,'fs',20)+R(-hw+w*.12,-hd+120,Math.min(600,w*.35),d*.45,'fl',50)+C(hw-w*.22,0,d*.14,'fl')+C(hw-w*.22-d*.34,0,d*.14,'fl');
    case 'bar':return R(-hw,-hd,w,d,'fd')+L(-hw,0,hw,0);
    case 'barstool':return C(0,0,hw)+C(0,0,hw*.45,'fl');
    case 'fridge':return R(-hw,-hd,w,d)+L(-hw,hd-80,hw,hd-80)+L(-hw,-hd,hw,hd-80);
    case 'toilet':return R(-hw,-hd,w,d*.28,'fs',30)+E(0,-hd+d*.62,w*.42,d*.36);
    case 'shower5':{const c=Math.min(w,d)*.4;return `<path class="fs" d="M${-hw} ${-hd}L${hw} ${-hd}L${hw} ${hd-c}L${hw-c} ${hd}L${-hw} ${hd}Z"/>`+L(hw,hd-c,hw-c,hd)+C(-hw*.2,-hd*.2,40,'fl');}
    case 'grab':return R(-hw,-hd,w,d,'fd',15);
    case 'sos':return R(-hw,-hd,w,d,'fd');
    case 'foldseat':return R(-hw,-hd,w,d,'fs',20)+L(-hw,-hd+60,hw,-hd+60);
    case 'basin':return R(-hw,-hd,w,d,'fs',20)+E(0,40,w*.32,d*.28,'fl');
    case 'shower':return R(-hw,-hd,w,d)+L(-hw,-hd,hw,hd)+C(0,0,40,'fl');
    case 'washer':return R(-hw,-hd,w,d,'fs',30)+C(0,40,Math.min(w,d)*.32,'fl');
    case 'sink':return R(-hw,-hd,w,d,'fs',20)+R(-hw+70,-hd+70,w-140,d-140,'fl',40);
    case 'plant':return C(0,0,hw*.95,'fd')+C(-hw*.3,-hd*.25,hw*.45,'fs')+C(hw*.3,hd*.15,hw*.4,'fs');
    case 'tree':{let s=`<circle class="ft" cx="0" cy="0" r="${hw}"/>`;for(let i=0;i<8;i++){const a=i*Math.PI/4;s+=L(Math.cos(a)*120,Math.sin(a)*120,Math.cos(a)*hw*.75,Math.sin(a)*hw*.75);}return s+C(0,0,140,'fd');}
    case 'rocker':return R(-hw,-hd+d*.15,w,d*.7,'fs',60)+R(-hw,-hd+d*.15,w,d*.22,'fd',50)+`<path class="fl" d="M${-hw-30} ${-hd} Q${-hw-90} 0 ${-hw-30} ${hd} M${hw+30} ${-hd} Q${hw+90} 0 ${hw+30} ${hd}"/>`;
    case 'stonetable':return C(0,0,hw,'fd')+C(0,0,hw*.8,'fl');
    case 'stool':return C(0,0,hw,'fd');
    case 'shrine':return `<rect x="${-hw}" y="${-hd}" width="${w}" height="${d}" fill="#B6533B" stroke="#7A2E1E" stroke-width="1" vector-effect="non-scaling-stroke"/>`;
    case 'car':return R(-hw,-hd,w,d,'fl',300)+R(-hw+w*.28,-hd+120,w*.42,d-240,'fl',120);
    case 'bed':{let s=R(-hw,-hd,w,d,'fd',20)+R(-hw+60,-hd+60,w-120,d-120,'fs',10);const n=Math.max(1,Math.round(w/600));for(let i=0;i<n;i++)s+=C(-hw+(i+.5)*w/n,(i%2?.12:-.12)*d,d*.3,'fl');return s;}
    case 'planter':return R(-hw,-hd,w,d,'fd',40)+R(-hw+80,-hd+80,w-160,d-160,'fs',20)+C(-w*.18,-d*.15,w*.16,'fl')+C(w*.18,-d*.1,w*.13,'fl')+C(0,d*.2,w*.15,'fl');
    case 'solar':{let s=R(-hw,-hd,w,d)+R(-hw,-hd,w,d*.18,'fd',60);for(let x=-hw+120;x<hw-60;x+=110)s+=L(x,-hd+d*.18,x,hd);return s;}
    case 'watertank':return C(0,0,hw)+C(0,0,hw*.55,'fl')+C(0,0,hw*.12,'fd');
    case 'awning2':{let s=R(-hw,-hd,w,d,'fl');for(let y=-hd+350;y<hd;y+=350)s+=L(-hw,y,hw,y);return s+R(hw-150,-hd,150,d,'fd');}
    case 'canopy':return R(-hw,-hd,w,d,'fl')+L(-hw,-hd,hw,hd)+L(-hw,hd,hw,-hd);
    case 'dryrack':{let s=R(-hw,-hd,w,d,'fl');for(const y of [-d*.3,0,d*.3])s+=L(-hw,y,hw,y);return s+R(-hw,-hd,80,d,'fd')+R(hw-80,-hd,80,d,'fd');}
  }
  return R(-hw,-hd,w,d);
}

/* ============ 2D plan render ============ */
const svg=$('#plan'),content=$('#content'),stage=$('#stage');
function defsSVG(){
  let s=`<pattern id="hb" patternUnits="userSpaceOnUse" width="140" height="140" patternTransform="rotate(45)"><rect class="hbbg" width="140" height="140"/><line class="hbln" x1="0" y1="0" x2="0" y2="140" stroke-width="34"/></pattern>`;
  s+=`<pattern id="hf" patternUnits="userSpaceOnUse" width="120" height="120"><rect class="hfbg" width="120" height="120"/><path class="hfln" d="M0 0L120 120M120 0L0 120" stroke-width="10" fill="none"/></pattern>`;
  s+=`<pattern id="hv" patternUnits="userSpaceOnUse" width="400" height="400" patternTransform="rotate(45)"><line class="hvln" x1="0" y1="0" x2="0" y2="400" stroke-width="18"/></pattern>`;
  for(const k in MATS){const z=MATS[k].size;s+=`<pattern id="m-${k}" patternUnits="userSpaceOnUse" width="${z}" height="${z}"><image href="${TEX[k].url}" xlink:href="${TEX[k].url}" width="${z}" height="${z}" preserveAspectRatio="none"/></pattern>`;}
  return s;
}
function stageSize(){const r=stage.getBoundingClientRect();return{w:r.width||800,h:r.height||600,l:r.left,t:r.top};}
function fitView(){const st=stageSize();const mw=SITE.w+6400,mh=SITE.h+6400;view.s=Math.min(st.w/mw,st.h/mh);view.x0=SITE.x0+SITE.w/2-st.w/2/view.s;view.y0=SITE.h/2-st.h/2/view.s;view.fitted=true;}
function toWorld(cx,cy){const st=stageSize();return{x:view.x0+(cx-st.l)/view.s,y:view.y0+(cy-st.t)/view.s};}

function openingSVG(w,o,s){
  const h=isH(w),dx=h?1:0,dy=h?0:1,nx=-dy,ny=dx,t=w.t;
  const cx=w.x1+dx*o.c,cy=w.y1+dy*o.c,P=(a,b)=>[cx+dx*a+nx*b,cy+dy*a+ny*b];
  const hw=o.w/2;let out='';
  const pl=pts=>pts.map(p=>p[0].toFixed(0)+','+p[1].toFixed(0)).join(' ');
  if(o.type==='win'&&o.gb){const r=segRect(w,o.c-hw,o.c+hw);out+=`<rect class="gap" x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}"/>`;
    for(const b of [-t/2,t/2]){const A=P(-hw,b),B=P(hw,b);out+=`<line class="lnd" x1="${A[0]}" y1="${A[1]}" x2="${B[0]}" y2="${B[1]}"/>`;}
    const n=Math.max(1,Math.round(o.w/200));for(let k=0;k<=n;k++){const a=-hw+o.w*k/n,A=P(a,-t/2),B=P(a,t/2);out+=`<line class="lnd" x1="${A[0]}" y1="${A[1]}" x2="${B[0]}" y2="${B[1]}"/>`;}}
  else if(o.type==='win'){const r=segRect(w,o.c-hw,o.c+hw);out+=`<rect class="gap" x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}"/>`;
    const cls=o.sill>=1500?'lnd':'ln';for(const b of [-t/2,-t/6,t/6,t/2]){const A=P(-hw,b),B=P(hw,b);out+=`<line class="${cls}" x1="${A[0]}" y1="${A[1]}" x2="${B[0]}" y2="${B[1]}"/>`;}
    for(const a of [-hw,hw]){const A=P(a,-t/2),B=P(a,t/2);out+=`<line class="ln" x1="${A[0]}" y1="${A[1]}" x2="${B[0]}" y2="${B[1]}"/>`;}}
  else if(o.type==='slide'){const r=segRect(w,o.c-hw,o.c+hw);out+=`<rect class="gap" x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}"/>`;
    const pw=o.w*.55;const A=P(-hw,-t/6),B=P(-hw+pw,-t/6),C2=P(hw-pw,t/6),D2=P(hw,t/6);

function solar(doy,minutes){
  const hr=minutes/60,rad=Math.PI/180,g=2*Math.PI/365*(doy-1+(hr-12)/24);
  const eq=229.18*(.000075+.001868*Math.cos(g)-.032077*Math.sin(g)-.014615*Math.cos(2*g)-.040849*Math.sin(2*g));
  const dec=.006918-.399912*Math.cos(g)+.070257*Math.sin(g)-.006758*Math.cos(2*g)+.000907*Math.sin(2*g)-.002697*Math.cos(3*g)+.00148*Math.sin(3*g);
  const tst=minutes+eq+4*LON-60*TZ,ha=(tst/4-180)*rad,lat=LAT*rad;
  const cz=Math.sin(lat)*Math.sin(dec)+Math.cos(lat)*Math.cos(dec)*Math.cos(ha);const zen=Math.acos(Math.max(-1,Math.min(1,cz)));
  const el=90-zen/rad;let az=Math.atan2(Math.sin(ha),Math.cos(ha)*Math.sin(lat)-Math.tan(dec)*Math.cos(lat))/rad+180;az=(az+360)%360;
  const e=el*rad,a=az*rad;

  const rise=720-4*(LON+h0)-eq+TZ*60,set=720-4*(LON-h0)-eq+TZ*60,noon=720-4*LON-eq+TZ*60;
  return{el,az,dir:{x:Math.cos(e)*Math.sin(a),y:Math.sin(e),z:-Math.cos(e)*Math.cos(a)},rise,set,noon};
}

function computeWx(){

    for(const r of fl.rooms){if(r.kind==='void'||r.hole)continue;const py=FB[f]+(r.kind==='out'?GL:0)+1.0;
      for(const rc of r.rects)for(let x=rc.x+step/2;x<rc.x+rc.w;x+=step)for(let y=rc.y+step/2;y<rc.y+rc.h;y+=step){
        const P=[x/1000,py,y/1000];if(B.some(b=>P[0]>b.x0&&P[0]<b.x1&&P[1]>b.y0&&P[1]<b.y1&&P[2]>b.z0&&P[2]<b.z1))continue;pts.push({x,y,P});}}

  if(sp.el>0){const a=sp.az*Math.PI/180,x=35+Math.sin(a)*24,y=35-Math.cos(a)*24;s+=`<line x1="35" y1="35" x2="${x}" y2="${y}" stroke="var(--sun)" stroke-width="1.5" stroke-dasharray="2 2"/><circle cx="${x}" cy="${y}" r="5" fill="var(--sun)"/>`;}
  if(S.wx.on||S.wx.mode!=='off'){const a=S.wx.dir*Math.PI/180,fx=35+Math.sin(a)*26,fy=35-Math.cos(a)*26,tx=35-Math.sin(a)*14,ty=35+Math.cos(a)*14;
    s+=`<line x1="${fx}" y1="${fy}" x2="${tx}" y2="${ty}" stroke="#2E7BC4" stroke-width="2.5"/><circle cx="${tx}" cy="${ty}" r="3.2" fill="#2E7BC4"/>`;}
  $('#compass').innerHTML=s;
}
function drawLegend(){
  const lg=$('#legend');
  if(S.view==='2d'&&S.wx.mode!=='off'){lg.style.display='block';lg.innerHTML=S.wx.mode==='rain'?`<div>淋雨范围　${dirName(S.wx.dir)} ${S.wx.speed}m/s ${RAINN[S.wx.rain]}</div><div class="bar" style="background:linear-gradient(90deg,${wetColor(0)},${wetColor(1)})"></div><div class="ticks"><span>偶尔溅到</span><span>一直被淋</span></div>`:`<div>迎风面　${dirName(S.wx.dir)} ${S.wx.speed}m/s</div><div class="ticks" style="justify-content:flex-start;gap:10px;margin-top:4px"><span><i style="display:inline-block;width:14px;height:4px;background:#D9534F;vertical-align:middle"></i> 迎风墙面，越粗风压越大</span></div><div class="ticks" style="justify-content:flex-start;gap:10px"><span><i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#D9534F"></i> 迎风门窗</span></div>`;return;}
  if(S.view!=='2d'||S.sun.heat==='off'){lg.style.display='none';return;}lg.style.display='block';
  if(S.sun.heat==='now'){lg.innerHTML=`<div>此刻光照 ${doyDate(S.sun.doy)} ${hm(S.sun.min)}</div><div class="ticks" style="gap:10px;justify-content:flex-start;margin-top:4px"><span><i style="display:inline-block;width:10px;height:10px;background:${heatColor(1,'now')};border-radius:2px"></i> 有阳光</span><span><i style="display:inline-block;width:10px;height:10px;background:${heatColor(0,'now')};border-radius:2px"></i> 阴影</span></div>`;}
  else{const g=[0,2,4,6,9].map(v=>heatColor(v,'day')).join(',');lg.innerHTML=`<div>全天日照时长 ${doyDate(S.sun.doy)}</div><div class="bar" style="background:linear-gradient(90deg,${g})"></div><div class="ticks"><span>0</span><span>2</span><span>4</span><span>6</span><span>9+ 小时</span></div>`;}
}

/* ============ 2D interaction ============ */
const ptrs=new Map();let gest=null;
function hintText(){
  if(S.view==='3d')return S.cam==='walk'?(matchMedia('(pointer:coarse)').matches?'左侧拖动行走，右侧拖动环顾，楼梯可以直接走上去':'点击画面后用 WASD 移动，鼠标环顾，楼梯可以直接走上去，Esc 释放鼠标'):'拖动旋转视角，双指或滚轮缩放，按住家具可以拖动摆放';
  if(VIEW&&S.tool==='select')return'拖动平移，双指或滚轮缩放，点房间或家具查看信息';
  return{select:'点选家具拖动摆放，拖动圆点旋转、方块改尺寸；拖动空白处平移，滚轮或双指缩放',
    measure:'依次点两个点测量距离，会自动吸附墙角；Esc 取消',
    demolish:'点击浅色的非承重墙拆除，两侧房间会自动合并；深色斜线是承重墙',
    paint:'先在右侧选材料，再点房间铺上'}[S.tool];
}
function measureSnap(p){
  const fl=cur(),th=12/view.s;let best=null,bd=th;
  for(const w of fl.walls){for(const [a,b] of wallSegs(w)){const r=segRect(w,a,b);for(const q of [[r.x,r.y],[r.x+r.w,r.y],[r.x,r.y+r.h],[r.x+r.w,r.y+r.h]]){const dd=Math.hypot(q[0]-p.x,q[1]-p.y);if(dd<bd){bd=dd;best={x:q[0],y:q[1]};}}}}
  if(best)return best;const q={x:Math.round(p.x/10)*10,y:Math.round(p.y/10)*10};
  if(S.mTemp){const dx=q.x-S.mTemp.x,dy=q.y-S.mTemp.y;if(Math.abs(dy)<Math.abs(dx)*.07)q.y=S.mTemp.y;else if(Math.abs(dx)<Math.abs(dy)*.07)q.x=S.mTemp.x;}
  return q;
}
svg.addEventListener('pointerdown',e=>{
  if(S.view!=='2d'||S.busy)return;svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];if(gest&&gest.type==='move'){const f=getF(gest.fid);if(f){f.x=gest.orig.x;f.y=gest.orig.y;}}
    gest={type:'pinch',d0:Math.hypot(a.x-b.x,a.y-b.y),m0:{x:(a.x+b.x)/2,y:(a.y+b.y)/2},v0:{...view}};S.guides=[];return;}
  if(ptrs.size>2)return;
  const t=e.target.closest('[data-k]'),k=t?t.dataset.k:null,id=t?t.dataset.id:null;
  gest={type:'pending',sx:e.clientX,sy:e.clientY,w:toWorld(e.clientX,e.clientY),k,id,v0:{...view}};
  if(S.tool==='select'&&!VIEW){
    if((k==='rot'||k==='size')&&S.sel&&S.sel.type==='furn'){const f=getF(S.sel.id);gest.type=k;gest.fid=f.id;gest.orig={...f};}
    else if(k==='furn'){const f=getF(id);S.sel={type:'furn',id};gest.type='move';gest.fid=id;gest.orig={x:f.x,y:f.y,rot:f.rot};render2D();renderPanel();}
  }
});
svg.addEventListener('pointermove',e=>{
  if(S.view!=='2d')return;
  if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const w=toWorld(e.clientX,e.clientY);
  if(S.tool==='measure'&&e.pointerType!=='touch'&&!gest){S.mHover=measureSnap(w);render2D();}
  if(!gest)return;
  if(gest.type==='pinch'){if(ptrs.size<2)return;const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y),m={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    const st=stageSize(),v0=gest.v0,wm={x:v0.x0+(gest.m0.x-st.l)/v0.s,y:v0.y0+(gest.m0.y-st.t)/v0.s};
    view.s=Math.max(.005,Math.min(.6,v0.s*d/gest.d0));view.x0=wm.x-(m.x-st.l)/view.s;view.y0=wm.y-(m.y-st.t)/view.s;render2D();return;}
  const moved=Math.hypot(e.clientX-gest.sx,e.clientY-gest.sy);
  if(gest.type==='pending'&&moved>6){gest.type='pan';}
  if(gest.type==='pan'){view.x0=gest.v0.x0-(e.clientX-gest.sx)/view.s;view.y0=gest.v0.y0-(e.clientY-gest.sy)/view.s;render2D();return;}
  const f=gest.fid&&getF(gest.fid);if(!f)return;
  if(gest.type==='move'){f.x=gest.orig.x+(w.x-gest.w.x);f.y=gest.orig.y+(w.y-gest.w.y);f.rot=gest.orig.rot;snapFurn(f,cur());gest.changed=true;render2D();}
  else if(gest.type==='rot'){let a=Math.atan2(w.y-f.y,w.x-f.x)*180/Math.PI+90;a=Math.round(a/15)*15;if(a>180)a-=360;f.rot=a;S.guides=[];gest.changed=true;render2D();updatePropsLive(f);}
  else if(gest.type==='size'){const r=-f.rot*Math.PI/180,dx=w.x-f.x,dy=w.y-f.y,lx=dx*Math.cos(r)-dy*Math.sin(r),ly=dx*Math.sin(r)+dy*Math.cos(r);
    f.w=Math.max(150,Math.round(2*Math.abs(lx-40)/10)*10);f.d=Math.max(150,Math.round(2*Math.abs(ly-40)/10)*10);gest.changed=true;render2D();updatePropsLive(f);}
});
function endPtr(e){
  if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);if(!gest)return;
  if(gest.type==='pinch'){if(ptrs.size===0)gest=null;return;}
  const g=gest;gest=null;
  if(g.type==='pending'&&e.type==='pointerup')tap(e,g);
  if((g.type==='move'||g.type==='rot'||g.type==='size')&&g.changed){S.guides=[];commit();}
  else if(g.type==='move'){S.guides=[];render2D();setTab('props');}
}
svg.addEventListener('pointerup',endPtr);svg.addEventListener('pointercancel',endPtr);
svg.addEventListener('wheel',e=>{if(S.view!=='2d')return;e.preventDefault();const st=stageSize(),w=toWorld(e.clientX,e.clientY);
  view.s=Math.max(.005,Math.min(.6,view.s*Math.pow(1.0015,-e.deltaY)));view.x0=w.x-(e.clientX-st.l)/view.s;view.y0=w.y-(e.clientY-st.t)/view.s;render2D();},{passive:false});

function tap(e,g){
  const k=g.k,id=g.id,fl=cur();
  if(S.tool==='select'){
    if(k==='furn'){if(VIEW){S.sel={type:'furn',id};setTab('props');render2D();}return;}
    if(k==='room'){S.sel={type:'room',id};}else if(k==='wall'){S.sel={type:'wall',id};}else{S.sel=null;if(isMobile()&&S.tab==='props')closeSheet();}
    if(S.sel)setTab('props');render2D();renderPanel();}
  else if(S.tool==='measure'){const p=measureSnap(g.w);if(!S.mTemp){S.mTemp=p;S.mHover=p;}else{S.measures[S.floor].push({a:S.mTemp,b:p});S.mTemp=null;S.mHover=null;}render2D();renderPanel();}
  else if(S.tool==='demolish'){if(k==='wall')demolish(id);else toast('点一面浅色的非承重墙');}
  else if(S.tool==='paint'){if(k==='room'){const r=getR(id);if(r.kind==='void')return;if(r.mat===S.mat){toast('已经是'+MATS[S.mat].n);return;}r.mat=S.mat;commit();toast(`${r.name}改为${MATS[S.mat].n}`);}}
}
function onBoundary(w){return(isH(w)&&(w.y1===0||w.y1===SITE.h))||(!isH(w)&&(w.x1===SITE.x0||w.x1===SITE.x0+SITE.w));}
function demolish(id){
  const fl=cur(),w=getW(id);if(!w)return;
  if(w.bearing){toast('这是承重墙，不能拆除');return;}
  if(w.kind==='rail'){toast('栏杆不在拆改范围内');return;}
  if(w.kind==='parapet'){toast('女儿墙是屋顶的安全护栏，不能拆除');return;}
  if(w.kind==='gwin'){toast('外廊栏板是安全护栏，不能拆除');return;}
  if(w.kind==='fence'&&onBoundary(w)){toast('院墙在用地边界上，不能拆除');return;}
  const sideA=[],sideB=[];
  for(const r of fl.rooms)for(const rc of r.rects){
    if(isH(w)){if(ov(rc.x,rc.x+rc.w,w.x1,w.x2)<100)continue;if(rc.y+rc.h===w.y1&&!sideA.includes(r))sideA.push(r);if(rc.y===w.y1&&!sideB.includes(r))sideB.push(r);}
    else{if(ov(rc.y,rc.y+rc.h,w.y1,w.y2)<100)continue;if(rc.x+rc.w===w.x1&&!sideA.includes(r))sideA.push(r);if(rc.x===w.x1&&!sideB.includes(r))sideB.push(r);}}
  fl.walls=fl.walls.filter(x=>x!==w);S.sel=null;let msg='已拆除这面墙';
  const all=[...new Set([...sideA,...sideB])];
  if(sideA.length&&sideB.length&&!all.some(r=>r.kind==='void')){
    const keep=all.reduce((a,b)=>gridUnion(a.rects).area>=gridUnion(b.rects).area?a:b);
    keep.rects=all.flatMap(r=>r.rects);keep.name=all.map(r=>r.name).join('+');if(all.some(r=>r.kind==='in'))keep.kind='in';
    fl.rooms=fl.rooms.filter(r=>r===keep||!all.includes(r));msg=`已拆除，合并为「${keep.name}」`;}
  commit();toast(msg+'，可以撤销');
}

/* ============ furniture ops ============ */
function addFurn(k){
  const st=stageSize(),c=toWorld(st.l+st.w/2,st.t+st.h/2);const f=F(k,Math.round(c.x),Math.round(c.y),0);
  if(S.view==='3d'&&T){const t=T.controls?T.controls.target:null;if(t){f.x=Math.round(t.x*1000);f.y=Math.round(t.z*1000);}}
  f.x=Math.max(SITE.x0+200,Math.min(SITE.x0+SITE.w-200,f.x));f.y=Math.max(200,Math.min(SITE.h-200,f.y));
  cur().furn.push(f);S.sel={type:'furn',id:f.id};if(S.view==='2d')setTool('select');commit();setTab('props');toast(`已添加${CAT[k].n}，拖动摆放到合适位置`);
}
function delSel(){if(!S.sel)return;if(S.sel.type==='furn'){cur().furn=cur().furn.filter(f=>f.id!==S.sel.id);S.sel=null;commit();toast('已删除');}else if(S.sel.type==='wall')demolish(S.sel.id);}
function rotSel(){const f=S.sel&&S.sel.type==='furn'&&getF(S.sel.id);if(!f)return;f.rot=((f.rot+90+180)%360)-180;snapFurn(f,cur());S.guides=[];commit();}
function dupSel(){const f=S.sel&&S.sel.type==='furn'&&getF(S.sel.id);if(!f)return;const n=Object.assign({},f,{id:uid('f'),x:f.x+300,y:f.y+300});cur().furn.push(n);S.sel={type:'furn',id:n.id};commit();}

/* ============ panel ============ */
const pbody=$('#pbody');
const isMobile=()=>matchMedia('(max-width:820px)').matches;
function openSheet(){const p=$('#panel');p.classList.remove('off');if(isMobile()){p.classList.add('open');document.body.classList.add('sheet');}else requestAnimationFrame(onResize);}
function closeSheet(){const p=$('#panel');if(isMobile()){p.classList.remove('open','full');document.body.classList.remove('sheet');}else{p.classList.add('off');requestAnimationFrame(onResize);}}
function setTab(t){S.tab=t;document.querySelectorAll('#tabs button[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===t));openSheet();renderPanel();}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='bClose'){closeSheet();return;}setTab(b.dataset.t);});
$('#bPanel').onclick=()=>{const p=$('#panel');if(p.classList.contains('off'))openSheet();else closeSheet();};
(()=>{const g=$('#grip');let y0=null,moved=false;
  g.addEventListener('pointerdown',e=>{y0=e.clientY;moved=false;g.setPointerCapture(e.pointerId);});
  g.addEventListener('pointermove',e=>{if(y0==null)return;const dy=e.clientY-y0;if(Math.abs(dy)>8)moved=true;});
  g.addEventListener('pointerup',e=>{if(y0==null)return;const dy=e.clientY-y0;y0=null;const p=$('#panel');
    if(!moved){p.classList.toggle('full');return;}if(dy>50){if(p.classList.contains('full'))p.classList.remove('full');else closeSheet();}else if(dy<-30)p.classList.add('full');});})();
function swatches(active,act){return`<div class="sw">${Object.keys(MATS).map(k=>`<button data-act="${act}" data-v="${k}" class="${k===active?'on':''}"><i style="background-image:url(${TEX[k].url})"></i>${MATS[k].n}</button>`).join('')}</div>`;}
function renderPanel(){
  let h='';const fl=cur();
  if(S.tab==='props'){
    if(S.tool==='paint'&&S.view==='2d'){h+=`<h3>铺地材料</h3><p class="muted">选好材料后，在平面图上点房间即可铺上。</p>${swatches(S.mat,'pickmat')}`;}
    else if(S.tool==='measure'&&S.view==='2d'){const ms=S.measures[S.floor];h+=`<h3>测量</h3><p class="muted">依次点两个点。靠近墙角时会自动吸附，接近水平或竖直时会自动拉直。</p>`;
      h+=ms.length?`<table class="rooms">${ms.map((m,i)=>`<tr><td>第 ${i+1} 段</td><td class="num">${Math.round(Math.hypot(m.b.x-m.a.x,m.b.y-m.a.y))} mm</td></tr>`).join('')}</table><div class="btns"><button class="btn" data-act="clearm">清除测量</button></div>`:'<p class="muted">还没有测量结果。</p>';}
    else if(VIEW&&S.sel&&S.sel.type==='furn'&&getF(S.sel.id)){const f=getF(S.sel.id);h+=`<h3>${CAT[f.k].n}</h3><div class="stat"><div><small>宽 × 深</small><b>${f.w} × ${f.d}</b></div><div><small>高</small><b>${f.h} mm</b></div></div>`;}
    else if(VIEW&&S.sel&&S.sel.type==='room'&&getR(S.sel.id)){const r=getR(S.sel.id);h+=`<h3>${esc(r.name)}</h3>`+(r.kind!=='void'?`<div class="stat"><div><small>使用面积</small><b>${fmtA(netArea(r,fl.walls))}</b></div><div><small>地面</small><b>${MATS[r.mat].n}</b></div></div>`:'');}
    else if(S.sel&&S.sel.type==='furn'&&getF(S.sel.id)){const f=getF(S.sel.id);
      h+=`<h3>${CAT[f.k].n}</h3><div class="row"><label>宽 mm</label><input type="number" step="10" min="100" data-fp="w" value="${f.w}"></div><div class="row"><label>深 mm</label><input type="number" step="10" min="100" data-fp="d" value="${f.d}"></div><div class="row"><label>高 mm</label><input type="number" step="10" min="50" data-fp="h" value="${f.h}"></div><div class="row"><label>角度 °</label><input type="number" step="15" data-fp="rot" value="${f.rot}"></div>
      <div class="btns"><button class="btn" data-act="rot90">旋转 90°</button><button class="btn" data-act="dup">复制</button><button class="btn danger" data-act="del">删除</button></div><p class="muted" style="margin-top:12px">靠近墙面 150mm 以内会自动贴墙并对齐角度。</p>`;}
    else if(S.sel&&S.sel.type==='room'&&getR(S.sel.id)){const r=getR(S.sel.id);
      h+=`<h3>房间</h3><div class="row"><label>名称</label><input type="text" data-rp="name" value="${esc(r.name)}"></div>`;
      if(r.kind!=='void')h+=`<div class="stat"><div><small>使用面积</small><b>${fmtA(netArea(r,fl.walls))}</b></div><div><small>轴线面积</small><b>${fmtA(gridUnion(r.rects).area/1e6)}</b></div></div><h4>地面材料</h4>${swatches(r.mat,'roommat')}`;}
    else if(S.sel&&S.sel.type==='wall'&&getW(S.sel.id)){const w=getW(S.sel.id);const kind=w.kind==='rail'?'栏杆':w.kind==='gwin'?'外廊栏板＋折叠窗':w.kind==='parapet'?'女儿墙':w.kind==='fence'?'院墙':w.bearing?'承重墙':'非承重墙';
      h+=`<h3>${kind}</h3><div class="stat"><div><small>长度</small><b>${wlen(w)} mm</b></div><div><small>厚度</small><b>${w.t} mm</b></div></div><p class="muted" style="margin-top:10px">墙上有 ${w.ops.length} 个门窗洞口。</p>`;
      if(w.kind==='gwin')h+=`<p class="muted">下半截是 1.1m 高的混凝土栏板，上面是可以全部收起的折叠窗，每扇约 0.6m 宽，用横框分成三块小玻璃。平时打开通风，大雨和台风前关上。</p><div class="btns"><button class="btn primary" data-act="gw">${S.gwOpen?'关上外廊窗':'打开外廊窗'}</button></div>`;
      if(!VIEW)h+=(w.bearing?'<p class="muted">承重墙关系到结构安全，不能拆改。</p>':(w.kind==='wall'||(w.kind==='fence'&&!onBoundary(w)))?`<div class="btns"><button class="btn danger" data-act="del">拆除这面墙</button></div>`:'');}
    else{h+=`<h3>${FN[S.floor]}</h3><p class="muted">${VIEW?'点房间、家具或墙体查看信息，也可以用测量工具量尺寸。':'点选家具、房间或墙体查看和修改属性。左侧工具可以测量、拆墙和更换地面。'}</p><div class="stat"><div><small>建筑面积约</small><b>${fmtA(grossArea(fl))}</b></div><div><small>家具</small><b>${fl.furn.length} 件</b></div></div>`+(S.floor===1?`<h4>外廊折叠窗</h4><p class="muted">现在是${S.gwOpen?'打开':'关闭'}状态。</p><div class="btns"><button class="btn primary" data-act="gw">${S.gwOpen?'关上外廊窗':'打开外廊窗'}</button></div>`:'');}
  }

  if(n.p[0]===9.0&&n.p[2]===6.6){n.t=[8.7,4.8,12];n.t2=[3.5,4.6,6.4];n.cap='二楼外廊：北边 2 米宽，东边 1.5 米宽，外沿是折叠玻璃窗；主卧二把东边南段外廊并进了房间。';}
  if(n.cap==='乌石合院方案三，欢迎回家。')n.cap='乌石合院'+SCHN+'，欢迎回家。';
}
let TS=null;
const easeS=t=>t*t*(3-2*t);
function tourBuild(){const groups=[],segs=[];let g=null;
  TOUR.forEach((k,i)=>{if(!g||k.cut){g={nodes:[]};groups.push(g);}
    g.nodes.push({p:k.p,t:k.t,i});
    if(k.hold){const dir=V3(...k.t).sub(V3(...k.p)).normalize().multiplyScalar(.5),p2=k.p2||V3(...k.p).add(dir).toArray();g.nodes.push({p:p2,t:k.t2||k.t,i,end:1});}});
  for(const gr of groups){gr.pc=new THREE.CatmullRomCurve3(gr.nodes.map(n=>V3(...n.p)),false,'centripetal');gr.tc=new THREE.CatmullRomCurve3(gr.nodes.map(n=>V3(...n.t)),false,'centripetal');}
  groups.forEach((gr,gi)=>{if(gi>0)segs.push({type:'cut',g:gr,k:0});
    for(let k=0;k<gr.nodes.length-1;k++){const a=gr.nodes[k],b=gr.nodes[k+1];
      if(b.end&&a.i===b.i)segs.push({type:'shot',g:gr,k,dur:TOUR[a.i].hold,cap:TOUR[a.i].cap,m0:TOUR[a.i].min,m1:TOUR[a.i].min+(TOUR[Math.min(a.i+1,TOUR.length-1)].min-TOUR[a.i].min)*.3});
      else segs.push({type:'move',g:gr,k,dur:Math.max(.3,TOUR[a.i].dur),m0:TOUR[a.i].min+(TOUR[Math.min(a.i+1,TOUR.length-1)].min-TOUR[a.i].min)*(a.end?.3:0),m1:TOUR[b.i].min});}
    if(gr.nodes.length===1)segs.push({type:'shot',g:gr,k:0,dur:2,cap:TOUR[gr.nodes[0].i].cap,m0:TOUR[gr.nodes[0].i].min,m1:TOUR[gr.nodes[0].i].min,single:1});});
  return segs;}
function tourCap(txt){const c=$('#tourCap');clearTimeout(tourCap._t);if(!txt){c.classList.remove('on');return;}if(c.classList.contains('on')&&c.textContent===txt)return;c.classList.remove('on');tourCap._t=setTimeout(()=>{c.textContent=txt;c.classList.add('on');},200);}
async function startTour(){
  if(!window.THREE){toast('三维引擎没有加载成功，无法播放导览');return;}
  if(S.view!=='3d'){await to3D();}
  if(S.cam==='walk')exitWalk(true);
  if(S.wx.on){S.wx.on=false;rainStop();}
  closeDial();closeSheet();
  const segs=tourBuild();
  TS={segs,j:0,t:0,playing:true,total:segs.reduce((a,x)=>a+(x.dur||0),0),el:0,sunMin:S.sun.min,hid:false};
  S.cam='tour';if(T.controls)T.controls.enabled=false;T.cam.fov=60;T.cam.updateProjectionMatrix();T.cam.up.set(0,1,0);
  applyVisibility();if(T.selBox)T.selBox.visible=false;document.body.classList.add('touring');$('#tourBtn').classList.remove('on');$('#tourPause').textContent='暂停';
  tourEnter(0);
}
function tourPoseAt(sg,s){const g=sg.g,n=g.nodes.length,u=n>1?Math.min(1,(sg.k+s)/(n-1)):0;
  if(n>1){T.cam.position.copy(g.pc.getPoint(u));T.cam.lookAt(g.tc.getPoint(u));}else{T.cam.position.set(...g.nodes[0].p);T.cam.lookAt(V3(...g.nodes[0].t));}
  if(sg.m0!=null){S.sun.min=Math.round(sg.m0+(sg.m1-sg.m0)*s);updateSun();}
  const y=T.cam.position.y;let f=0;for(let i=1;i<NF;i++)if(y>=FB[i]+(i===NF-1&&NF===3?1:.7))f=i;if(f!==S.floor){S.floor=f;document.querySelectorAll('#floorSeg button').forEach(x=>x.classList.toggle('on',+x.dataset.f===f));}}
function tourEnter(j){TS.j=j;TS.t=0;TS.hid=false;const sg=TS.segs[j];if(!sg){endTour(true);return;}
  if(sg.type==='cut'){TS.fading=true;tourCap('');$('#fade').style.opacity=1;setTimeout(()=>{if(!TS)return;tourEnter(j+1);tourPoseAt(TS.segs[TS.j],0);$('#fade').style.opacity=0;setTimeout(()=>{if(TS)TS.fading=false;},450);},480);return;}
  if(sg.type==='shot')tourCap(sg.cap);tourPoseAt(sg,0);}
function tourStep(dt){if(!TS||!TS.playing||TS.fading)return;TS.t+=dt;TS.el+=dt;$('#tourProg i').style.width=Math.min(100,TS.el/TS.total*100)+'%';
  const sg=TS.segs[TS.j];const s=Math.min(1,TS.t/Math.max(.01,sg.dur));tourPoseAt(sg,sg.type==='shot'?s:easeS(s));
  if(sg.type==='move'&&s>.15&&!TS.hid){TS.hid=true;tourCap('');}
  if(s>=1)tourEnter(TS.j+1);}
function endTour(finished){if(S.cam!=='tour')return;S.cam='orbit';T.cam.fov=45;T.cam.updateProjectionMatrix();
  document.body.classList.remove('touring');$('#fade').style.opacity=0;
  if(T.controls){T.controls.target.set(8.5,1.5,6.5);if(!finished){T.cam.position.set(-7,15,22);}T.controls.enabled=true;T.controls.update();}
  if(TS&&!finished)S.sun.min=TS.sunMin;updateSun();TS=null;applyVisibility();if(T.selBox)T.selBox.visible=true;
  setTimeout(()=>tourCap(''),finished?2500:0);$('#tourBtn').classList.add('on');renderTools();renderPanel();}
$('#tourBtn').onclick=startTour;
$('#tourExit').onclick=()=>endTour(false);
$('#tourPause').onclick=()=>{if(!TS)return;TS.playing=!TS.playing;$('#tourPause').textContent=TS.playing?'暂停':'继续';};

/* ============ boot ============ */
function switchScheme(n){if(n===SCH)return;try{sessionStorage.setItem('wushi-sch',n);}catch(e){}
  const h='#s'+n+'&v='+S.view+'&f='+S.floor;try{history.replaceState(null,'',h);}catch(e){location.hash=h;}location.reload();}
function boot(){
  {const sel=$('#schSel');sel.value=String(SCH);sel.onchange=()=>switchScheme(+sel.value);}
  const HP=new URLSearchParams((location.hash||'').replace(/^#s\d+&?/,''));const hf=+HP.get('f');
  if(!VIEW)document.title='乌石合院 '+SCHN+' 设计';
  if(VIEW){for(const id of ['bUndo','bRedo','bSave','bMore'])$('#'+id).style.display='none';$('#tabs [data-t="lib"]').style.display='none';document.title='乌石合院 '+SCHN;}
  initTextures();$('#defs').innerHTML=defsSVG();
  loadSaved();snapshot();updateUndoUI();
  if(VIEW)S.layer='all';
  renderTools();renderPanel();fitView();draw2D();getDownloads();if(hf>0&&hf<NF)setFloor(hf);
  if(window.THREE&&(HP.get('v')==='3d'||(VIEW&&HP.get('v')!=='2d')))setTimeout(()=>to3D(),350);else setTimeout(showHint,600);
  new ResizeObserver(()=>{render2D();}).observe(stage);
}
boot();
</script>
