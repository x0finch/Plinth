# 检查 + 部署到 Cloudflare Workers
# - 拉取请求、推送：跑类型检查、核心包测试、主题颜色检查、构建
# - 推送到 main：检查通过后迁移线上 D1、部署、同步 Worker 密钥
# 需要在 GitHub 仓库 Settings → Secrets and variables → Actions 里配置，见 README“部署”
name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:theme -w @plinth/web
      # 构建会生成路由表 routeTree.gen.ts（不入库），网页的类型检查要在它之后
      - run: npm run build -w @plinth/web
      - run: npx tsc --noEmit -p apps/web

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # 还没配 Cloudflare 时跳过部署（只留一条提醒），不让每次推送都标红
      - name: 检查部署配置
        id: cfg
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning title=没有部署::还没配置 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID（仓库 Settings → Secrets and variables → Actions），本次跳过部署。见 README“部署”。"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.cfg.outputs.ready == 'true'
      - uses: actions/setup-node@v5
        if: steps.cfg.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.cfg.outputs.ready == 'true'
      - run: npm run build -w @plinth/web
        if: steps.cfg.outputs.ready == 'true'
      - name: 迁移线上数据库
        if: steps.cfg.outputs.ready == 'true'
        working-directory: apps/web
        run: npx wrangler d1 migrations apply plinth --remote
      - name: 部署
        if: steps.cfg.outputs.ready == 'true'
        working-directory: apps/web
        run: npx wrangler deploy
      - name: 同步 Worker 密钥（只上传填了的项）
        if: steps.cfg.outputs.ready == 'true'
        working-directory: apps/web
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          KEY_ENCRYPTION_SECRET: ${{ secrets.KEY_ENCRYPTION_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          node -e '
            const names = ["BETTER_AUTH_SECRET", "KEY_ENCRYPTION_SECRET", "RESEND_API_KEY", "GOOGLE_CLIENT_ID", "GOOGLE_CLIENT_SECRET", "MAIL_FROM", "APP_URL"];
            const out = Object.fromEntries(names.filter(n => process.env[n]).map(n => [n, process.env[n]]));
            for (const n of ["BETTER_AUTH_SECRET", "KEY_ENCRYPTION_SECRET"]) if (!out[n]) { console.error(`缺少 ${n}`); process.exit(1); }
            require("fs").writeFileSync(process.env.RUNNER_TEMP + "/secrets.json", JSON.stringify(out));
            console.log("同步：" + Object.keys(out).join("、"));
          '
          npx wrangler secret bulk "$RUNNER_TEMP/secrets.json"
          rm "$RUNNER_TEMP/secrets.json"
